name: subtitld
base: core22
adopt-info: subtitld
summary: Create, edit, transcribe, translate and dub subtitles
# The store's listing: a paragraph a line, as the store keeps line breaks;
# "-" lists, but no headings or Markdown links.
description: |
  Subtitld is a free and open source subtitle editor. Time subtitles on the waveform, transcribe and translate them with engines that can run on your own machine, and dub them with synthetic voices.

  Timing on the waveform
  - A timeline with the audio's waveform: drag a subtitle to move it, drag its edges to retime it
  - Snapping to the neighbouring subtitles and to a grid of frames or seconds, with zoom for fine work
  - A vertical timeline beside the list, for working down the subtitles
  - A quality check for reading speed, duration, line count and line length

  Video and audio
  - The video with the current subtitle drawn over it, as it will be seen, with safe-area guides
  - Playback speed, looping and frame stepping
  - A mixer for the video's sound and the dubs, with EQ, compressor and gate per track
  - 4K and 8K videos get a lighter proxy to edit with

  Speakers
  - Name the speakers and give each one a face from the video, a colour and, if you like, a track of their own on the timeline

  Transcription, translation and dubbing
  - Transcribe the video's speech into timed subtitles, or speak into the microphone and watch it become subtitles
  - Translate the subtitles, keeping each translation beside the original
  - Dub every subtitle with a synthetic voice, one voice per speaker, fitted to its duration, or record your own
  - Export the dub as WAV, FLAC or MP3: the whole mix, a track per speaker, or the voices or the background alone

  Speech recognition (whisper.cpp, Vosk), offline translation, more voices (Piper, Kokoro, and voice cloning with Qwen3-TTS, Coqui XTTS and F5-TTS) and voice separation come as add-ons, installed from inside Subtitld, many of them fully offline. Two online voices come built in.

  Editing
  - Undo, find and replace with regular expressions, autosave and backups
  - A plain-text view to edit all the subtitles as one document
  - Keyboard shortcuts you can change
  - Projects (.usfx) keep the subtitles with the speakers, their faces and the dubs

  Formats: opens and saves SubRip (SRT), WebVTT, TTML, DFXP, SAMI, Scenarist (SCC), JSON and USF; opens SubStation Alpha, MicroDVD and iTunes Timed Text. Videos in MP4, MKV, MOV, WebM and more, through FFmpeg.

  subtitld.cc, Subtitld's community hub: find subtitles made for the video you open, rate them, and publish your own, from inside the app.

  To open files on external drives: sudo snap connect subtitld:removable-media

  Website: https://subtitld.org

  Source and issues: https://github.com/Subtitld/subtitld

  Screenshots: Tears of Steel, (CC) Blender Foundation, https://mango.blender.org
grade: stable
confinement: strict
compression: lzo

architectures:
  - build-on: amd64

apps:
  subtitld:
    command: bin/subtitld-launcher
    extensions:
      - kde-neon-6
    environment:
      PYTHONPATH: $SNAP/lib/python3.10/site-packages:$PYTHONPATH
    plugs:
      - home
      - removable-media
      - audio-playback
      - audio-record
      - pulseaudio
      - network
      - opengl
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  # PySide6's FFmpeg decodes AV1, the format of most YouTube downloads, only
  # with a GPU's help (VAAPI), which the snap cannot reach, and has no
  # software AV1 decoder: the picture of an AV1 video never showed. The same
  # FFmpeg, 7.1.5 (PySide6 6.11.2's), built with dav1d (VideoLAN's AV1
  # decoder), takes its place in the PySide6 tree (the subtitld part copies
  # it there).
  qt-ffmpeg:
    plugin: nil
    source: https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz
    source-checksum: sha256/de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f
    build-packages:
      - nasm
      - pkg-config
      - libdav1d-dev
      - zlib1g-dev
      - libbz2-dev
    override-build: |
      # The libraries Qt's FFmpeg plugin links, and only what they need:
      # no VAAPI or TLS, which the snap has no library for either.
      ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu --enable-shared --disable-static \
        --disable-programs --disable-doc --disable-avdevice --disable-avfilter --disable-postproc \
        --disable-autodetect --enable-zlib --enable-bzlib --enable-libdav1d
      make -j"$CRAFT_PARALLEL_BUILD_COUNT"
      make install DESTDIR="$CRAFT_PART_INSTALL/qt-ffmpeg"
    prime:
      # In the snap as PySide6's own, not here.
      - -qt-ffmpeg

  subtitld:
    after: [qt-ffmpeg]
    plugin: python
    source: .
    build-packages:
      - python3-dev
      - build-essential
    stage-packages:
      - ffmpeg
      # dav1d, for the FFmpeg that replaces PySide6's (qt-ffmpeg part).
      - libdav1d5
      - libpulse0
      - libportaudio2
      - libsndfile1
      - libasound2-plugins
      # libasound2 alone does not ship /usr/share/alsa/alsa.conf — that
      # lives in libasound2-data, which apt would normally pull as a
      # Recommends. snapcraft installs stage-packages with
      # --no-install-recommends, so without this entry alsa.conf is
      # missing and ALSA falls back to compile-time defaults that don't
      # know about the pulse plugin → PortAudio enumerates zero devices
      # → sounddevice raises "Error querying device -1".
      - libasound2-data
      # QtMultimedia tries to dlopen libpipewire-0.3 first and otherwise
      # logs "Couldn't load pipewire-0.3 library". Stage it so Qt has the
      # option; it still falls back to PulseAudio if the pipewire socket
      # isn't accessible at runtime.
      - libpipewire-0.3-0
    prime:
      # Graphics drivers come from the kf6-core22 content snap (the
      # kde-neon-6 extension points LIBGL_DRIVERS_PATH there); the copies
      # ffmpeg's dependencies pull in are never used.
      - -usr/lib/x86_64-linux-gnu/dri
      - -usr/lib/x86_64-linux-gnu/vdpau
      - -usr/lib/x86_64-linux-gnu/libLLVM*
      - -usr/lib/x86_64-linux-gnu/libGLX_mesa*
      - -usr/lib/x86_64-linux-gnu/libgallium*
      - -usr/lib/x86_64-linux-gnu/libdrm_amdgpu*
      - -usr/lib/x86_64-linux-gnu/libdrm_intel*
      - -usr/lib/x86_64-linux-gnu/libdrm_nouveau*
      - -usr/lib/x86_64-linux-gnu/libdrm_radeon*
    override-pull: |
      craftctl default
      craftctl set version="$(grep -oP "__version__\s*=\s*'\K[^']+" src/subtitld/__init__.py)"
    override-build: |
      craftctl default
      # Install the package itself (with all extras) into the snap
      $CRAFT_PART_INSTALL/bin/pip install --no-compile "$CRAFT_PART_SRC"
      # Slim it: pip installs more than the app uses.
      SITE="$CRAFT_PART_INSTALL/lib/python3.10/site-packages"
      # The app asks for opencv-python and mediapipe for
      # opencv-contrib-python: pip installs both, two whole OpenCVs, each
      # with its own Qt 5. One headless contrib build (a superset, minus
      # the windows neither of them opens) serves both.
      OPENCV=$($CRAFT_PART_INSTALL/bin/pip show opencv-contrib-python | awk '/^Version:/{print $2}')
      $CRAFT_PART_INSTALL/bin/pip uninstall -y opencv-python opencv-contrib-python
      $CRAFT_PART_INSTALL/bin/pip install --no-compile --no-deps "opencv-contrib-python-headless==$OPENCV"
      # PySide6 comes whole. Drop the Qt modules the app never imports
      # (WebEngine alone is 200 MB), QML, and Qt's own translations, which
      # it does not load.
      QT="$SITE/PySide6/Qt"
      rm -rf "$QT/qml" "$QT/translations" "$QT/libexec/QtWebEngineProcess" "$QT"/resources/qtwebengine* \
        "$QT"/plugins/designer "$QT"/plugins/webview "$QT"/plugins/sceneparsers "$QT"/plugins/geometryloaders \
        "$QT"/plugins/renderers "$QT"/plugins/renderplugins "$QT"/plugins/assetimporters "$QT"/plugins/qmltooling \
        "$QT"/plugins/imageformats/libqpdf.so
      for module in WebEngine Pdf 3D Quick3D Designer WebView Graphs DataVisualization; do
        rm -f "$QT"/lib/libQt6"$module"*.so* "$SITE"/PySide6/Qt"$module"*
      done
      # PySide6's FFmpeg out, the one built with dav1d in (qt-ffmpeg part).
      # The wheel holds three copies of each library (no symlinks); the
      # build's soname links take their place.
      for lib in libavcodec.so libavformat.so libavutil.so libswresample.so libswscale.so; do
        rm -f "$QT"/lib/$lib*
        cp -a "$CRAFT_STAGE"/qt-ffmpeg/usr/lib/x86_64-linux-gnu/$lib.* "$QT"/lib/
      done
      # Ship a minimal self-contained alsa.conf that routes the
      # default PCM through PulseAudio. The stock alsa.conf in
      # core22 loads its real definitions from
      # /usr/share/alsa/alsa.conf.d/*.conf, but inside a strict snap
      # those drop-ins never end up being parsed (we tried patching
      # `@func datadir` to use $SNAP via getenv — the rewrite landed
      # but `aplay -L` still saw only the built-in `null` PCM, so
      # something else in the drop-in chain bails out silently).
      # PortAudio only needs a hinted `default`/`pulse` it can open,
      # and the pulse plugin module + libpulse are already staged,
      # so cut out alsa.conf.d entirely.
      mkdir -p "$CRAFT_PART_INSTALL/etc"
      cat > "$CRAFT_PART_INSTALL/etc/subtitld-alsa.conf" <<'ALSACONF'
      # Subtitld snap: minimal ALSA config — route default PCM via
      # PulseAudio. Loaded via $ALSA_CONFIG_PATH from
      # bin/subtitld-launcher; replaces /usr/share/alsa/alsa.conf
      # because the drop-ins that file relies on don't load inside
      # the snap mount namespace.

      pcm.!default {
          type pulse
          hint {
              show on
              description "Default ALSA Output (PulseAudio Sound Server)"
          }
      }
      ctl.!default {
          type pulse
      }
      pcm.pulse {
          type pulse
          hint {
              show on
              description "PulseAudio Sound Server"
          }
      }
      ctl.pulse {
          type pulse
      }
      ALSACONF
      # snapcraft's python plugin normalizes shebangs during the build
      # step, but scripts created by the pip install above still carry
      # the build-staging path ($CRAFT_PART_INSTALL/bin/python3). Rewrite
      # them to resolve via PATH at runtime.
      for f in "$CRAFT_PART_INSTALL"/bin/*; do
        if [ -f "$f" ] && head -1 "$f" | grep -q '^#!.*python'; then
          sed -i '1s|^#!.*|#!/usr/bin/env python3|' "$f"
        fi
      done
      # The kde-neon-6 extension stages its own Qt6 under $SNAP/kf6/...
      # and prepends it to LD_LIBRARY_PATH. PySide6's pip wheel bundles
      # a different Qt6 under site-packages/PySide6/Qt/lib. Mixing the
      # two produces "undefined symbol ... Qt_6_PRIVATE_API" at import.
      # This launcher runs after the extension's command-chain and
      # forces PySide6's bundled Qt to be found first.
      cat > "$CRAFT_PART_INSTALL/bin/subtitld-launcher" <<'LAUNCHER'
      #!/bin/bash
      export LD_LIBRARY_PATH="$SNAP/lib/python3.10/site-packages/PySide6/Qt/lib:$LD_LIBRARY_PATH"
      # The extension also points QT_PLUGIN_PATH at its own Qt's plugins,
      # which Qt searches before PySide6's. Its Wayland ones (xdg-shell,
      # wayland-egl) fail to load against PySide6's Qt, Qt falls back to
      # wl-shell, which GNOME does not offer, and no window appears. Only
      # PySide6's plugins, then; and X11 if Wayland still fails.
      export QT_PLUGIN_PATH="$SNAP/lib/python3.10/site-packages/PySide6/Qt/plugins"
      unset QML2_IMPORT_PATH
      if [ -n "$WAYLAND_DISPLAY" ]; then
        export QT_QPA_PLATFORM="wayland;xcb"
      fi
      # Force ALSA to read our self-contained minimal conf (built in
      # override-build) and to find pulse + rate plugins under the
      # staged plugin dir. The minimal conf defines only `default`
      # and `pulse` PCMs (both routed to libasound_module_pcm_pulse),
      # which is enough for PortAudio's ALSA host to enumerate at
      # least one device and stop raising "Error querying device -1".
      export ALSA_CONFIG_PATH="$SNAP/etc/subtitld-alsa.conf"
      export ALSA_PLUGIN_DIR="$SNAP/usr/lib/x86_64-linux-gnu/alsa-lib"
      # PulseAudio: snapd bind-mounts the host's pulse runtime dir at
      # /run/user/$UID/pulse/ when audio-playback is connected, but the
      # snap's $XDG_RUNTIME_DIR points to /run/user/$UID/snap.subtitld/
      # instead — so libpulse's default socket discovery
      # ($XDG_RUNTIME_DIR/pulse/native) misses it, ALSA's pulse plugin
      # fails to open the default PCM, and PortAudio enumerates zero
      # devices. Point PULSE_SERVER at the bind-mounted socket.
      PULSE_RUNTIME="/run/user/$(id -u)/pulse"
      export PULSE_SERVER="unix:$PULSE_RUNTIME/native"
      export PULSE_RUNTIME_PATH="$PULSE_RUNTIME"
      exec "$SNAP/bin/subtitld" "$@"
      LAUNCHER
      chmod +x "$CRAFT_PART_INSTALL/bin/subtitld-launcher"
