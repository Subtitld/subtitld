name: subtitld
base: core22
adopt-info: subtitld
summary: Create and edit subtitles
description: |
  Subtitld is a professional subtitle editor and dubbing application with
  support for transcription, translation, waveform visualization, and
  multi-speaker dubbing.
grade: stable
confinement: strict
compression: lzo

architectures:
  - build-on: amd64

apps:
  subtitld:
    command: bin/subtitld-launcher
    extensions:
      - kde-neon-6
    environment:
      PYTHONPATH: $SNAP/lib/python3.10/site-packages:$PYTHONPATH
    plugs:
      - home
      - removable-media
      - audio-playback
      - audio-record
      - pulseaudio
      - network
      - opengl
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  subtitld:
    plugin: python
    source: .
    build-packages:
      - python3-dev
      - build-essential
    stage-packages:
      - ffmpeg
      - libpulse0
      - libportaudio2
      - libsndfile1
      - libasound2-plugins
      # libasound2 alone does not ship /usr/share/alsa/alsa.conf — that
      # lives in libasound2-data, which apt would normally pull as a
      # Recommends. snapcraft installs stage-packages with
      # --no-install-recommends, so without this entry alsa.conf is
      # missing and ALSA falls back to compile-time defaults that don't
      # know about the pulse plugin → PortAudio enumerates zero devices
      # → sounddevice raises "Error querying device -1".
      - libasound2-data
      # QtMultimedia tries to dlopen libpipewire-0.3 first and otherwise
      # logs "Couldn't load pipewire-0.3 library". Stage it so Qt has the
      # option; it still falls back to PulseAudio if the pipewire socket
      # isn't accessible at runtime.
      - libpipewire-0.3-0
      # Diagnostic-only (aplay -L, pactl info) to triangulate audio
      # plumbing inside strict confinement. Cheap; can be dropped once
      # the audio path is solid.
      - alsa-utils
      - pulseaudio-utils
    override-pull: |
      craftctl default
      craftctl set version="$(grep -oP "__version__\s*=\s*'\K[^']+" src/subtitld/__init__.py)"
    override-build: |
      craftctl default
      # Install the package itself (with all extras) into the snap
      $CRAFT_PART_INSTALL/bin/pip install --no-compile "$CRAFT_PART_SRC"
      # Ship a minimal self-contained alsa.conf that routes the
      # default PCM through PulseAudio. The stock alsa.conf in
      # core22 loads its real definitions from
      # /usr/share/alsa/alsa.conf.d/*.conf, but inside a strict snap
      # those drop-ins never end up being parsed (we tried patching
      # `@func datadir` to use $SNAP via getenv — the rewrite landed
      # but `aplay -L` still saw only the built-in `null` PCM, so
      # something else in the drop-in chain bails out silently).
      # PortAudio only needs a hinted `default`/`pulse` it can open,
      # and the pulse plugin module + libpulse are already staged,
      # so cut out alsa.conf.d entirely.
      mkdir -p "$CRAFT_PART_INSTALL/etc"
      cat > "$CRAFT_PART_INSTALL/etc/subtitld-alsa.conf" <<'ALSACONF'
      # Subtitld snap: minimal ALSA config — route default PCM via
      # PulseAudio. Loaded via $ALSA_CONFIG_PATH from
      # bin/subtitld-launcher; replaces /usr/share/alsa/alsa.conf
      # because the drop-ins that file relies on don't load inside
      # the snap mount namespace.

      pcm.!default {
          type pulse
          hint {
              show on
              description "Default ALSA Output (PulseAudio Sound Server)"
          }
      }
      ctl.!default {
          type pulse
      }
      pcm.pulse {
          type pulse
          hint {
              show on
              description "PulseAudio Sound Server"
          }
      }
      ctl.pulse {
          type pulse
      }
      ALSACONF
      # snapcraft's python plugin normalizes shebangs during the build
      # step, but scripts created by the pip install above still carry
      # the build-staging path ($CRAFT_PART_INSTALL/bin/python3). Rewrite
      # them to resolve via PATH at runtime.
      for f in "$CRAFT_PART_INSTALL"/bin/*; do
        if [ -f "$f" ] && head -1 "$f" | grep -q '^#!.*python'; then
          sed -i '1s|^#!.*|#!/usr/bin/env python3|' "$f"
        fi
      done
      # The kde-neon-6 extension stages its own Qt6 under $SNAP/kf6/...
      # and prepends it to LD_LIBRARY_PATH. PySide6's pip wheel bundles
      # a different Qt6 under site-packages/PySide6/Qt/lib. Mixing the
      # two produces "undefined symbol ... Qt_6_PRIVATE_API" at import.
      # This launcher runs after the extension's command-chain and
      # forces PySide6's bundled Qt to be found first.
      cat > "$CRAFT_PART_INSTALL/bin/subtitld-launcher" <<'LAUNCHER'
      #!/bin/bash
      export LD_LIBRARY_PATH="$SNAP/lib/python3.10/site-packages/PySide6/Qt/lib:$LD_LIBRARY_PATH"
      # Force ALSA to read our self-contained minimal conf (built in
      # override-build) and to find pulse + rate plugins under the
      # staged plugin dir. The minimal conf defines only `default`
      # and `pulse` PCMs (both routed to libasound_module_pcm_pulse),
      # which is enough for PortAudio's ALSA host to enumerate at
      # least one device and stop raising "Error querying device -1".
      export ALSA_CONFIG_PATH="$SNAP/etc/subtitld-alsa.conf"
      export ALSA_PLUGIN_DIR="$SNAP/usr/lib/x86_64-linux-gnu/alsa-lib"
      # PulseAudio: snapd bind-mounts the host's pulse runtime dir at
      # /run/user/$UID/pulse/ when audio-playback is connected, but the
      # snap's $XDG_RUNTIME_DIR points to /run/user/$UID/snap.subtitld/
      # instead — so libpulse's default socket discovery
      # ($XDG_RUNTIME_DIR/pulse/native) misses it, ALSA's pulse plugin
      # fails to open the default PCM, and PortAudio enumerates zero
      # devices. Point PULSE_SERVER at the bind-mounted socket.
      PULSE_RUNTIME="/run/user/$(id -u)/pulse"
      export PULSE_SERVER="unix:$PULSE_RUNTIME/native"
      export PULSE_RUNTIME_PATH="$PULSE_RUNTIME"
      # One-shot diagnostic: log whether the launcher runs and whether
      # the ALSA + pulse bits we expect are actually present at runtime.
      # Set SUBTITLD_DEBUG_AUDIO=0 in the environment to silence.
      if [ "${SUBTITLD_DEBUG_AUDIO:-1}" != "0" ]; then
        {
          echo "[subtitld-launcher] $(date -Is)"
          echo "  SNAP=$SNAP"
          echo "  ALSA_CONFIG_PATH=$ALSA_CONFIG_PATH (exists=$([ -f "$ALSA_CONFIG_PATH" ] && echo yes || echo NO))"
          echo "  ALSA_PLUGIN_DIR=$ALSA_PLUGIN_DIR (exists=$([ -d "$ALSA_PLUGIN_DIR" ] && echo yes || echo NO))"
          if [ -d "$ALSA_PLUGIN_DIR" ]; then
            echo "  plugins: $(ls "$ALSA_PLUGIN_DIR" 2>/dev/null | tr '\n' ' ')"
          fi
          echo "  alsa.conf.d: $(ls "$SNAP/usr/share/alsa/alsa.conf.d" 2>/dev/null | tr '\n' ' ')"
          echo "  PULSE_SERVER=$PULSE_SERVER (socket=$([ -S "$PULSE_RUNTIME/native" ] && echo yes || echo NO))"
          echo "  alsa.conf patch grep:"
          grep -nE 'datadir|getenv|alsa\.conf\.d' "$ALSA_CONFIG_PATH" 2>/dev/null | head -5 | sed 's/^/    /'
          echo "  aplay -L (PCMs ALSA can see):"
          "$SNAP/usr/bin/aplay" -L 2>&1 | sed 's/^/    /' | head -25
          echo "  pactl info (pulse server reachable?):"
          "$SNAP/usr/bin/pactl" info 2>&1 | sed 's/^/    /' | head -10
          echo "  sounddevice host apis + devices:"
          "$SNAP/bin/python3" -c "import sounddevice as sd; print('hostapis:', [a['name'] for a in sd.query_hostapis()]); print('devices:', list(sd.query_devices())); print('default:', sd.default.device)" 2>&1 | sed 's/^/    /'
        } >&2
      fi
      exec "$SNAP/bin/subtitld" "$@"
      LAUNCHER
      chmod +x "$CRAFT_PART_INSTALL/bin/subtitld-launcher"
