:root { --stage-width: 1920px; --stage-height: 1080px; --safe-left: 192px; --safe-right: 192px;
        --safe-top: 108px; --safe-bottom: 108px; --cue-duration: 4000ms; --cue-time: 0ms;
        --safe-w: calc(var(--stage-width) - var(--safe-left) - var(--safe-right));
        --safe-h: calc(var(--stage-height) - var(--safe-top) - var(--safe-bottom)); }
html { background: #3b4048; }
body { margin: 0; position: relative; width: var(--stage-width); height: var(--stage-height); overflow: hidden; }
.stage { position: absolute; inset: 0; }
.safe { position: absolute; left: var(--safe-left); right: var(--safe-right); top: var(--safe-top); bottom: var(--safe-bottom); }
.bg { position: absolute; inset: 0; display: none; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
:root { --bg-color: #9a958c; --wedge: #6e6a63; --ink: #141414; --paper: #c8c3b8; --number-size: 440px; }

.bg { display: block; background: var(--bg-color); animation: fade-in 200ms both; }
.cross { position: absolute; inset: 0; animation: fade-in 300ms both; }
.cross::before, .cross::after { content: ""; position: absolute; background: var(--ink); }
.cross::before { left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; }
.cross::after { top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; }
.disc { position: absolute; left: 50%; top: 50%; --d: min(880px, calc(var(--stage-height) * .82), calc(var(--stage-width) * .9));
        width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); border-radius: 50%;
        background: var(--paper); overflow: hidden; animation: fade-in 200ms both; }
.half { position: absolute; top: 0; width: 50%; height: 100%; overflow: hidden; }
.half.r { left: 50%; } .half.l { left: 0; }
.half i { position: absolute; top: 0; width: 100%; height: 100%; background: var(--wedge); }
.half.r i { left: -100%; border-radius: 100% 0 0 100% / 50% 0 0 50%; transform-origin: 100% 50%; animation: sweep 550ms linear both; }
.half.l i { left: 100%; border-radius: 0 100% 100% 0 / 0 50% 50% 0; transform-origin: 0 50%; animation: sweep 550ms 550ms linear both; }
.disc::before, .disc::after { content: ""; position: absolute; z-index: 2; border-radius: 50%; border: 6px solid var(--ink); }
.disc::before { inset: 0; } .disc::after { inset: 9%; border-width: 4px; }
.safe { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.num { position: relative; font-family: "Teko"; font-weight: 600; color: var(--ink); line-height: .8;
       font-size: min(var(--number-size), calc(var(--stage-height) * .5)); padding-top: .08em;
       animation: flick 1ms 200ms steps(1, end) both; }
.caption { position: relative; font-family: "Teko"; font-weight: 500; font-size: 48px; letter-spacing: .3em; padding-left: .3em;
           color: var(--ink); text-transform: uppercase; animation: flick 1ms 400ms steps(1, end) both; }
.caption[data-empty] { display: none; }
.theme-out .stage { animation: fade-out 400ms steps(4, end) both; }
@keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(180deg); } }
@keyframes flick { from { opacity: 0; } }
</style>
</head>

<div class="stage"><div class="bg"></div><div class="cross"></div><div class="disc"><div class="half r"><i></i></div><div class="half l"><i></i></div></div>
<div class="safe"><div class="num" data-slot="main">3</div><div class="caption" data-slot="caption"></div></div></div>
</body>
