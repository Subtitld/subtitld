:root { --size: 42px; --paper: rgba(242, 234, 216, 0.961); --ink: #1f1a17; --accent: #9b2d20; --dim: 1; --safe-left: 192px; --safe-right: 192px; --safe-top: 108px; --safe-bottom: 108px; --stage-width: 1920px; --stage-height: 1080px; }

html { background: #3a3a3a; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, p, figure, blockquote { margin: 0; }
[data-empty] { display: none !important; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(18px); } }
@keyframes fade-down { from { opacity: 0; transform: translateY(-18px); } }
@keyframes sink-out { to { opacity: 0; transform: translateY(16px); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 65% { opacity: 1; transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes shrink-out { to { opacity: 0; transform: scale(.92); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes wipe-r { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

.screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); box-sizing: border-box; }
:root[data-dim="1"] .screen { background: rgba(0, 0, 0, .45); animation: fade-in 500ms ease-out both; }
.sheet { width: min(1180px, 100%); box-sizing: border-box; padding: calc(var(--size) * 1.2) calc(var(--size) * 1.6);
  background: var(--paper); color: var(--ink); font-family: "Libre Baskerville", serif; font-size: var(--size);
  box-shadow: 0 18px 40px rgba(0, 0, 0, .35); outline: 2px solid var(--ink); outline-offset: -14px;
  animation: fade-up 600ms cubic-bezier(.2, .7, .2, 1) both; }
.heading { text-align: center; font-weight: 700; font-size: 1.5em; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.note { text-align: center; font-style: italic; font-size: .7em; margin-top: .3em; opacity: .75; }
.rows { display: grid; grid-template-columns: 1fr auto; row-gap: .5em; margin-top: 1em; align-items: baseline; }
.characters, .actors { display: contents; }
.characters li { grid-column: 1; grid-row: calc(var(--i) + 1); display: flex; align-items: baseline; font-style: italic;
  animation: fade-in 400ms ease-out both; animation-delay: calc(500ms + var(--i) * min(130ms, 450ms / max(var(--items, 1), 1))); }
.characters li::after { content: ""; flex: 1; min-width: 1.5em; margin: 0 .5em; border-bottom: 3px dotted currentColor;
  opacity: .6; transform-origin: 0 50%; animation: grow-x 500ms ease-out both; animation-delay: calc(500ms + var(--i) * min(130ms, 450ms / max(var(--items, 1), 1))); }
.actors li { grid-column: 2; grid-row: calc(var(--i) + 1); font-weight: 700; font-variant: small-caps; letter-spacing: .03em;
  animation: fade-in 400ms ease-out both; animation-delay: calc(800ms + var(--i) * min(130ms, 450ms / max(var(--items, 1), 1))); }
:root.theme-out .screen { animation: fade-out 600ms ease-in both; }
</style>
</head>

</div></div>
