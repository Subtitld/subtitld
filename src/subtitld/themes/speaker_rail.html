html { background: #3a3a3a; }
body { min-height: 100vh; margin: 0; display: flex; align-items: flex-end; justify-content: center;
       padding-bottom: 10vh; box-sizing: border-box; }

:root { --font-size: 48px; --color: #ffffff; --rail: #f5a524; --box-color: rgba(14,16,20,0.85); }
.text { display: inline-block; font-family: "Inter", sans-serif; font-weight: 600;
        font-size: var(--font-size); line-height: 1.3; color: var(--color); text-align: left;
        padding: 0.3em 0.8em 0.36em 0.7em; background: var(--box-color);
        border-left: 0.16em solid var(--rail); border-radius: 0 6px 6px 0;
        animation: rail-in 240ms cubic-bezier(.2,.7,.2,1) both; }
.theme-out .text { animation: rail-out 200ms ease-in both; }
@keyframes rail-in { from { opacity: 0; transform: translateX(-16px); } }
@keyframes rail-out { to { opacity: 0; } }
