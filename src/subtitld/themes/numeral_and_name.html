:root { --stage-width: 1920px; --stage-height: 1080px; --safe-left: 192px; --safe-right: 192px;
        --safe-top: 108px; --safe-bottom: 108px; --cue-duration: 4000ms; --cue-time: 0ms;
        --safe-w: calc(var(--stage-width) - var(--safe-left) - var(--safe-right));
        --safe-h: calc(var(--stage-height) - var(--safe-top) - var(--safe-bottom)); }
html { background: #3b4048; }
body { margin: 0; position: relative; width: var(--stage-width); height: var(--stage-height); overflow: hidden; }
.stage { position: absolute; inset: 0; }
.safe { position: absolute; left: var(--safe-left); right: var(--safe-right); top: var(--safe-top); bottom: var(--safe-bottom); }
.bg { position: absolute; inset: 0; display: none; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
:root { --bg-on: 1; --bg-color: #0d0e11; --number-color: #c9a46a; --color: #f3eee6; --number-size: 300px; --name-size: 46px; }

:root[data-bg-on="1"] .bg { display: block; background: var(--bg-color); animation: fade-in 500ms ease-out both; }
.safe { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.num { font-family: "Cormorant Garamond"; font-weight: 500; line-height: .8; color: var(--number-color);
       font-size: min(var(--number-size), calc(var(--safe-w) * 0.45));
       animation: num-in 1000ms cubic-bezier(.2,.7,.2,1) both; }
.rule { width: 120px; height: 3px; background: var(--number-color); margin: 48px 0 40px;
        animation: grow 700ms 500ms ease-out both; }
.name { font-family: "Inter"; font-weight: 400; font-size: var(--name-size); line-height: 1.35;
        letter-spacing: .32em; padding-left: .32em; text-transform: uppercase; color: var(--color);
        max-width: var(--safe-w); animation: track-in 800ms 650ms ease-out both; }
.sub { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 500; font-size: calc(var(--name-size) * 0.95);
       color: var(--color); opacity: .72; margin-top: 20px; animation: fade-in 600ms 850ms both; }
.num[data-empty], .sub[data-empty] { display: none; }
.theme-out .safe { animation: out-up 700ms ease-in both; }
.theme-out .bg { animation: fade-out 700ms ease-in both !important; }
@keyframes num-in { from { opacity: 0; transform: translateY(30px); filter: blur(8px); } }
@keyframes track-in { from { opacity: 0; letter-spacing: .6em; } }
@keyframes out-up { to { opacity: 0; transform: translateY(-16px); } }
</style>
