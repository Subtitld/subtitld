:root { --placement: upper_third; --point: down_left; --size: 72px; --arrow-size: 200px; --color: #ffe14d; --outline: rgba(0, 0, 0, 0.902); --safe-left: 192px; --safe-right: 192px; --safe-top: 108px; --safe-bottom: 108px; --stage-width: 1920px; --stage-height: 1080px; }

html { background: #3a3a3a; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, p, figure, blockquote { margin: 0; }
[data-empty] { display: none !important; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(18px); } }
@keyframes fade-down { from { opacity: 0; transform: translateY(-18px); } }
@keyframes sink-out { to { opacity: 0; transform: translateY(16px); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 65% { opacity: 1; transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes shrink-out { to { opacity: 0; transform: scale(.92); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes wipe-r { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

.pointer { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px;
  font-family: "Caveat", cursive; color: var(--color); }
.label { padding: 0 12px; text-align: center; animation: scrawl 500ms ease-out both;
  text-shadow: 0 0 2px var(--outline), 0 0 2px var(--outline), 0 3px 8px var(--outline); }
.text { font-weight: 700; font-size: var(--size); line-height: 1; }
.detail { font-weight: 700; font-size: calc(var(--size) * .55); line-height: 1.1; opacity: .9; }
.arrow { width: var(--arrow-size); height: calc(var(--arrow-size) * .8); overflow: visible; flex: none; }
.arrow path { fill: none; stroke: var(--color); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 450ms 350ms ease-in-out both;
  filter: drop-shadow(0 0 2px var(--outline)) drop-shadow(0 2px 4px var(--outline)); }
.arrow .head { animation: draw 200ms 800ms ease-out both; }
.horiz { display: none; height: calc(var(--arrow-size) * .48); }
:root[data-point="down_right"] .pointer { align-items: flex-end; }
:root[data-point="down_right"] .diag { transform: scaleX(-1); }
:root[data-point="up_left"] .pointer { flex-direction: column-reverse; }
:root[data-point="up_left"] .diag { transform: scaleY(-1); }
:root[data-point="up_right"] .pointer { flex-direction: column-reverse; align-items: flex-end; }
:root[data-point="up_right"] .diag { transform: scale(-1, -1); }
:root[data-point="left"] .pointer, :root[data-point="right"] .pointer { flex-direction: row-reverse; align-items: center; }
:root[data-point="right"] .pointer { flex-direction: row; }
:root[data-point="left"] .diag, :root[data-point="right"] .diag { display: none; }
:root[data-point="left"] .horiz, :root[data-point="right"] .horiz { display: block; }
:root[data-point="right"] .horiz { transform: scaleX(-1); }
:root.theme-out .pointer { animation: fade-out 400ms ease-in both; }
@keyframes scrawl { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
</style>
