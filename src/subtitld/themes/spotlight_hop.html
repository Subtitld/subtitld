:root { --font-size: 54px; --color: #ffffff; --outline: #000000; --accent: #9dff2e; --lit-text: #101010; --karaoke-color: #9dff2e; }

html { background: #4a5560 linear-gradient(160deg, #2c3e50, #6b7b8c 60%, #c9b79c); }
body { min-height: 100vh; margin: 0; display: flex; align-items: flex-end; justify-content: center;
       padding: 0 40px 10vh; box-sizing: border-box; }
.t { text-align: center; font-size: var(--font-size); line-height: 1.15; color: var(--color); }
.t .word { display: inline-block; }

.t { font-family: "Poppins", "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-weight: 800; text-transform: uppercase; line-height: 1.32;
     text-shadow: 3.0px 0.0px 0 var(--outline), 2.8px 1.1px 0 var(--outline), 2.1px 2.1px 0 var(--outline), 1.1px 2.8px 0 var(--outline), 0.0px 3.0px 0 var(--outline), -1.1px 2.8px 0 var(--outline), -2.1px 2.1px 0 var(--outline), -2.8px 1.1px 0 var(--outline), -3.0px 0.0px 0 var(--outline), -2.8px -1.1px 0 var(--outline), -2.1px -2.1px 0 var(--outline), -1.1px -2.8px 0 var(--outline), -0.0px -3.0px 0 var(--outline), 1.1px -2.8px 0 var(--outline), 2.1px -2.1px 0 var(--outline), 2.8px -1.1px 0 var(--outline), 0 4px 6px rgba(0,0,0,.6); }
.t .word { padding: 0 0.14em; border-radius: 0.2em; animation: hop 50ms steps(1, end) both; animation-duration: min(70ms, calc(300ms / var(--words, 1)));
           animation-delay: calc(var(--i) * min(70ms, calc(300ms / var(--words, 1)))); }
.t .line:last-child .word:last-child { animation-name: stay; animation-duration: 1ms; }
@keyframes hop { 0% { background: transparent; } 1% { background: var(--accent); color: var(--lit-text); text-shadow: none; transform: scale(1.08); }
                 100% { background: transparent; } }
@keyframes stay { from { background: transparent; } to { background: var(--accent); color: var(--lit-text); text-shadow: none;
                   box-shadow: 0 4px 0 rgba(0,0,0,.4); transform: scale(1.06) rotate(-2deg); } }

.theme-out .t { animation: social-out 220ms ease-in both; }
@keyframes social-out { to { opacity: 0; transform: scale(0.92); } }
</style>
