:root { --stage-width: 1920px; --stage-height: 1080px; --safe-left: 192px; --safe-right: 192px; --safe-top: 108px; --safe-bottom: 108px; --placement: lower_third; --name-size: 54px; --box: rgba(16, 24, 32, 0.941); --wipe-a: #00c2a8; --wipe-b: #ff4f6d; --name-color: #ffffff; --role-color: #bfeee6; }

html { background: #3a3a3a; }
body { min-height: 100vh; margin: 0; display: flex; align-items: flex-end; padding: 0 0 12vh 10vw; box-sizing: border-box; }

.ss { position: relative; display: inline-block; padding: 18px 40px 20px; overflow: hidden; font-family: "Space Grotesk"; max-width: 1150px;
      clip-path: inset(0 0 0 0); animation: ss-bg 800ms steps(1, end) both; background: var(--box); }
.ss::before, .ss::after { content: ""; position: absolute; left: 0; right: 0; z-index: 2; transform: translateX(-101%);
                          animation: ss-sweep 820ms cubic-bezier(.7, 0, .3, 1) both; }
.ss::before { top: 0; height: 50%; background: var(--wipe-a); }
.ss::after { bottom: 0; height: 50%; background: var(--wipe-b); animation-delay: 90ms; }
.in { position: relative; z-index: 1; animation: ss-show 1ms 420ms steps(1, end) both; }
.name { margin: 0; color: var(--name-color); font-weight: 700; font-size: var(--name-size); line-height: 1.1; }
.role { margin: 6px 0 0; color: var(--role-color); font-weight: 500; font-size: calc(var(--name-size) * 0.52); line-height: 1.25; }
.role[data-empty] { display: none; }
.in .line { animation: ss-slide 400ms 430ms cubic-bezier(.2, .8, .2, 1) both; }
.theme-out .ss::before, .theme-out .ss::after { animation: ss-cover 300ms cubic-bezier(.7, 0, .3, 1) both; }
.theme-out .ss::after { animation-delay: 60ms; }
.theme-out .ss { animation: ss-close 250ms 300ms ease-in both; }
@keyframes ss-bg { 0% { background-color: rgba(0, 0, 0, 0); } 50% { background-color: var(--box); } }
@keyframes ss-sweep { 0% { transform: translateX(-101%); } 50% { transform: translateX(0); } 100% { transform: translateX(101%); } }
@keyframes ss-show { from { opacity: 0; } }
@keyframes ss-slide { from { transform: translateX(-18px); } }
@keyframes ss-cover { from { transform: translateX(-101%); } to { transform: translateX(0); } }
@keyframes ss-close { to { clip-path: inset(0 0 0 100%); } }
</style>
