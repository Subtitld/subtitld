html { background: #3a3a3a linear-gradient(135deg, #56677a, #23232b); }
body { min-height: 100vh; margin: 0; display: flex; align-items: flex-end; justify-content: center;
       padding-bottom: 10vh; box-sizing: border-box; }
body, .subtitld-frame { font-size: var(--font-size); }

:root { --font-size: 50px; --ink: #1f1b2e; --paper1: #ffd84d; --paper2: #7ee0c3; --paper3: #ff9ec7; --paper4: #9ec5ff; }
.text { font: 700 var(--font-size)/1.6 "Fredoka", sans-serif; color: var(--ink); text-align: center; }
.text .word { display: inline-block; margin: 0 0.1em; padding: 0 0.28em 0.04em; border-radius: 12px; background: var(--paper1);
  box-shadow: 0 0 0 5px #ffffff, 3px 6px 0 5px rgba(0,0,0,0.3); transform: rotate(var(--r, -3deg));
  animation: slap 200ms cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--i) * min(55ms, 200ms / var(--words))); }
.text .word:nth-child(4n+2) { background: var(--paper2); --r: 2.5deg; }
.text .word:nth-child(4n+3) { background: var(--paper3); --r: -1.5deg; }
.text .word:nth-child(4n+4) { background: var(--paper4); --r: 3.5deg; }
.theme-out .text .word { animation: peel 220ms ease-in both; }
@keyframes slap { from { opacity: 0; transform: scale(1.5) rotate(12deg); } }
@keyframes peel { to { opacity: 0; transform: translateY(-14px) rotate(-10deg) scale(0.9); } }
</style>
