:root { --name-size: 50px; --heading-color: #ffffff; --role-color: #e8b45a; --name-color: #ffffff; --backdrop: 1; --backdrop-color: rgba(13, 17, 23, 0.922); --safe-left: 192px; --safe-right: 192px; --safe-top: 108px; --safe-bottom: 108px; --stage-width: 1920px; --stage-height: 1080px; }

html { background: #3a3a3a; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, p, figure, blockquote { margin: 0; }
[data-empty] { display: none !important; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(18px); } }
@keyframes fade-down { from { opacity: 0; transform: translateY(-18px); } }
@keyframes sink-out { to { opacity: 0; transform: translateY(16px); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 65% { opacity: 1; transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes shrink-out { to { opacity: 0; transform: scale(.92); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes wipe-r { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

.screen { position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-family: "Outfit", sans-serif;
  padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
  text-shadow: 0 2px 14px rgba(0, 0, 0, .55); }
:root[data-backdrop="1"] .screen { background: var(--backdrop-color); text-shadow: none; animation: fade-in 500ms ease-out both; }
.heading { margin: 0 0 calc(var(--name-size) * 1.1); font-size: calc(var(--name-size) * .62); font-weight: 500;
  letter-spacing: .34em; text-transform: uppercase; color: var(--heading-color); padding-left: .34em;
  animation: track 800ms cubic-bezier(.2, .7, .2, 1) both; }
.grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(var(--name-size) * 1.4);
  row-gap: calc(var(--name-size) * .42); width: 100%; max-width: 1500px; align-items: baseline; }
.roles, .names { display: contents; }
.grid::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--role-color);
  opacity: .5; transform-origin: 50% 0; animation: grow-y 900ms 200ms cubic-bezier(.2, .7, .2, 1) both; }
.grid li { animation: fade-up 450ms cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(350ms + var(--i) * min(160ms, 750ms / max(var(--items, 1), 1))); }
.roles li { grid-column: 1; grid-row: calc(var(--i) + 1); text-align: right; font-size: calc(var(--name-size) * .46);
  font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--role-color); }
.names li { grid-column: 2; grid-row: calc(var(--i) + 1); font-size: var(--name-size); font-weight: 800;
  line-height: 1.08; color: var(--name-color); }
:root.theme-out .screen { animation: fade-out 700ms ease-in both; }
@keyframes track { from { opacity: 0; letter-spacing: .6em; } }
</style>
</head>
<body>
<div class="screen">
  <h2 class="heading" data-slot="main">Crew</h2>
  <div class="grid">
    <ul class="roles" data-slot="roles"><li>Directed by</li></ul>
    <ul class="names" data-slot="names"><li>Ana Lima</li></ul>
  </div>
</div>
</body>
</html>
