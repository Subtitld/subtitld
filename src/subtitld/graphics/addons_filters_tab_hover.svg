  <linearGradient id="g" x1="0" x2="0" y1="0" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#566f82"/><stop offset="1" stop-color="#3e4f5e"/></linearGradient>
 </defs>
 <rect width="40" height="34" fill="url(#w)"/>
 <path d="M0 0L8.72 32.55Q9.91 37 14.52 37L40 37V0Z" transform="translate(0 1)" fill="#000" fill-opacity="0.45"/>
