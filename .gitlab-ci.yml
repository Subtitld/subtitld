stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

build:
  stage: build
  image: python:3.9
  script:
    - pip install build
    - VERSION=$(date +%y.%m.%d.%H%M)
    - sed -i "s/__version__ = '.*'/__version__ = '$VERSION'/" subtitld/__init__.py
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy_testpypi:
  stage: deploy
  image: python:3.9
  only:
    - branches
  except:
    - master
  script:
    - pip install twine
    - twine upload --repository testpypi dist/* -u __token__ -p "$TESTPYPI_TOKEN"
  dependencies:
    - build

deploy_pypi:
  stage: deploy
  image: python:3.9
  only:
    - master
  script:
    - pip install twine
    - twine upload dist/* -u __token__ -p "$PYPI_TOKEN"
  dependencies:
    - build
