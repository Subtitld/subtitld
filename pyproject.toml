[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitld"
dynamic = ["version"]
description = "Subtitld"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL3"}
authors = [
    {name = "Jonatã Bolzan Loss", email = "subtitld@subtitld.org"}
]
keywords = ["subtitld"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Topic :: Multimedia",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # Ranged, not exact: PyPI stopped serving 6.10.0 and the exact pin made
    # every fresh install fail. The upper bound keeps a Qt minor bump from
    # arriving unnoticed.
    "PySide6>=6.11.2,<6.12",
    "PySideSix-Frameless-Window",
    # 0.10.21 is no longer on PyPI; kept on the 0.10 line rather than 1.x,
    # whose API the speaker and mouth-tracking code has not moved to.
    "mediapipe>=0.10.30,<0.11",
    "opencv-python",
    "python-i18n",
    "python-docx",
    "pycaption",
    # Imported directly by file_io and usf; it used to arrive only through
    # pycaption.
    "beautifulsoup4",
    "chardet==6.0.0",
    "pysubs2",
    "platformdirs",
    # Trusted CAs for urllib downloads in frozen builds (modules/net.py).
    "certifi",
    # Imported directly by the audio, recording and timeline code. It used to
    # arrive only through other packages (pywhispercpp among them).
    "numpy",
    "sounddevice",
    "soundfile",
    "edge-tts",
    "gTTS",
    "scipy"
]

# Optional feature groups. For now these mirror deps already in `dependencies`
# above; once the relevant panels guard their imports with try/except, the
# corresponding packages can be removed from `dependencies` so that
# `pip install subtitld` installs only the core runtime and users opt into
# features via e.g. `pip install subtitld[dub]`. Speech-to-text and
# translation engines are add-ons (installed from the Add-ons panel), not
# extras.
[project.optional-dependencies]
vision = ["mediapipe>=0.10.30,<0.11", "opencv-python"]
dub = ["edge-tts", "gTTS"]
all = [
    "mediapipe>=0.10.30,<0.11",
    "opencv-python",
    "edge-tts",
    "gTTS",
]

[project.urls]
Homepage = "https://subtitld.org"
Issues = "https://gitlab.com/jonata/subtitld/issues"

[project.scripts]
subtitld = "subtitld.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "subtitld.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["subtitld*"]

[tool.setuptools.package-data]
subtitld = ["graphics/*", "locale/*", "ftfy/*"]
