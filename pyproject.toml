[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitld"
dynamic = ["version"]
description = "Subtitld"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL3"}
authors = [
    {name = "Jonatã Bolzan Loss", email = "subtitld@subtitld.org"}
]
keywords = ["subtitld"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Topic :: Multimedia",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PySide6==6.10.0",
    "PySideSix-Frameless-Window",
    "mediapipe==0.10.21",
    "opencv-python",
    "python-i18n",
    "python-docx",
    "pycaption",
    "chardet==6.0.0",
    "pysubs2",
    "translate",
    "autohex",
    "platformdirs",
    "psutil",
    "vosk",
    "assemblyai",
    "deep_translator",
    "soundfile",
    "edge-tts"
]

# Optional feature groups. For now these mirror deps already in `dependencies`
# above; once the relevant panels guard their imports with try/except, the
# corresponding packages can be removed from `dependencies` so that
# `pip install subtitld` installs only the core runtime and users opt into
# features via e.g. `pip install subtitld[transcribe]`.
[project.optional-dependencies]
transcribe = ["vosk", "assemblyai"]
translate = ["translate", "deep_translator"]
vision = ["mediapipe==0.10.21", "opencv-python"]
dub = ["edge-tts"]
all = [
    "vosk",
    "assemblyai",
    "translate",
    "deep_translator",
    "mediapipe==0.10.21",
    "opencv-python",
    "edge-tts",
]

[project.urls]
Homepage = "https://subtitld.org"
Issues = "https://gitlab.com/jonata/subtitld/issues"

[project.scripts]
subtitld = "subtitld.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "subtitld.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["subtitld*"]

[tool.setuptools.package-data]
subtitld = ["graphics/*", "locale/*", "ftfy/*"]
