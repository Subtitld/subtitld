name: Release

# Builds everything (build.yml), then publishes it.
#
#   channel=stable  →  a tag push (refs/tags/v*)
#   channel=beta    →  a push whose commit subject ends with "(build)"
#   channel=<input> →  run by hand with a channel chosen
#
# Any other push stops at the first, few-seconds job. To build without
# publishing, run build.yml instead.

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      channel:
        description: Publish channel
        required: true
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  MSSTORE_SELLER_ID: '80111150'
  MSSTORE_APP_ID: '9MXLZSL8JPQH'

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - id: channel
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -n "$DISPATCH_CHANNEL" ]; then
            channel="$DISPATCH_CHANNEL"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=stable
          elif printf '%s' "$HEAD_MSG" | head -n 1 | grep -qE '\(build\)[[:space:]]*$'; then
            channel=beta
          else
            channel=
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Channel: '${channel:-<none, nothing to publish>}'"

  build:
    needs: channel
    if: needs.channel.outputs.channel != ''
    uses: ./.github/workflows/build.yml

  # ──────────────────────────────────────────────────────────────
  # builds.subtitld.org: AppImage and Windows installer, both channels
  # ──────────────────────────────────────────────────────────────
  publish-server:
    needs: [channel, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '{appimage,windows-installer}'
          merge-multiple: true
      - name: Upload to builds.subtitld.org
        env:
          SSHPASS: ${{ secrets.USER_PASS }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -e scp -o stricthostkeychecking=no *.AppImage \
            subtitld-builds@62.72.63.228:/home/subtitld-builds/htdocs/builds.subtitld.org/appimage/
          sshpass -e scp -o stricthostkeychecking=no *-Setup.exe \
            subtitld-builds@62.72.63.228:/home/subtitld-builds/htdocs/builds.subtitld.org/windows/

  # ──────────────────────────────────────────────────────────────
  # Snap Store: the beta or stable channel
  # ──────────────────────────────────────────────────────────────
  publish-snap:
    needs: [channel, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: snap
      - id: snap
        run: echo "path=$(ls subtitld_*.snap | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: ${{ needs.channel.outputs.channel }}

  # ──────────────────────────────────────────────────────────────
  # Microsoft Store: stable only (no package flight for betas)
  # ──────────────────────────────────────────────────────────────
  publish-msstore:
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-msix
      - uses: microsoft/setup-msstore-cli@v1
      - name: Configure msstore CLI
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" `
            --sellerId "${{ env.MSSTORE_SELLER_ID }}" `
            --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" `
            --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"
      - name: Publish to Microsoft Store
        run: |
          $msix = Get-ChildItem -Filter 'Subtitld-*.msix' | Select-Object -First 1
          msstore publish --appId $env:MSSTORE_APP_ID $msix.FullName

  # ──────────────────────────────────────────────────────────────
  # PyPI: stable only; the wheel and sdist build.yml tested
  # ──────────────────────────────────────────────────────────────
  publish-pypi:
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pip
          path: dist
      - run: |
          pip install twine
          twine upload dist/* -u __token__ -p "${{ secrets.PYPI_TOKEN }}"

  # ──────────────────────────────────────────────────────────────
  # AUR: stable only, building from the tag
  # ──────────────────────────────────────────────────────────────
  publish-aur:
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    continue-on-error: true  # remove once AUR_SSH_PRIVATE_KEY is configured
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Point the PKGBUILD at the tag
        run: |
          curl -fsSL -o tag.tar.gz "https://github.com/Subtitld/subtitld/archive/refs/tags/$TAG.tar.gz"
          sum=$(sha256sum tag.tar.gz | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^_tag=.*/_tag=$TAG/" \
            -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/subtitld/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: subtitld
          pkgbuild: packaging/aur/subtitld/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.VERSION }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

  # ──────────────────────────────────────────────────────────────
  # GitHub Release: stable only, with every package and the Haiku
  # ports as they go to haikuports
  # ──────────────────────────────────────────────────────────────
  publish-github-release:
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '{pip,appimage,snap,flatpak,windows-*,macos-dmg,haiku}'
          merge-multiple: true
      - name: Point the Haiku recipe at the tag
        run: |
          curl -fsSL -o tag.tar.gz "https://github.com/Subtitld/subtitld/archive/refs/tags/$TAG.tar.gz"
          sum=$(sha256sum tag.tar.gz | cut -d' ' -f1)
          sed -i -e "s|^SOURCE_URI=.*|SOURCE_URI=\"https://github.com/Subtitld/subtitld/archive/refs/tags/$TAG.tar.gz\"|" \
            -e "s|^CHECKSUM_SHA256=.*|CHECKSUM_SHA256=\"$sum\"|" \
            -e "s|^SOURCE_DIR=.*|SOURCE_DIR=\"subtitld-${TAG#v}\"|" \
            "artifacts/haikuports/media-video/subtitld/subtitld-$VERSION.recipe"
          # One file for the release: the ports, to unpack into haikuports.
          tar -C artifacts/haikuports -czf "artifacts/subtitld-$VERSION-haikuports.tar.gz" dev-python media-video
          rm -r artifacts/haikuports
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # The tag is a free-form label; the build version is the date.
          name: Subtitld ${{ github.ref_name }}
          body: |
            Build version: `${{ env.VERSION }}`
          append_body: true
          files: artifacts/*
          generate_release_notes: true
