name: Release

# Builds everything (build.yml), then publishes it.
#
#   channel=stable  →  a release published on GitHub (Releases, Draft a new
#                      release, its tag created with it); its title and
#                      notes are kept, the builds attached to it
#   channel=beta    →  a push whose commit subject ends with "(build)", or
#                      a run by hand
#
# Any other push stops at the first, few-seconds job. To build without
# publishing, run build.yml instead.

on:
  release:
    types: [published]
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      channel:
        description: Publish channel (stable comes from publishing a release)
        required: true
        type: choice
        options:
          - beta

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  MSSTORE_SELLER_ID: '80111150'
  MSSTORE_APP_ID: '9MXLZSL8JPQH'

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - id: channel
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            channel=stable
          elif [ -n "$DISPATCH_CHANNEL" ]; then
            channel="$DISPATCH_CHANNEL"
          elif printf '%s' "$HEAD_MSG" | head -n 1 | grep -qE '\(build\)[[:space:]]*$'; then
            channel=beta
          else
            channel=
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Channel: '${channel:-<none, nothing to publish>}'"

  build:
    needs: channel
    if: needs.channel.outputs.channel != ''
    uses: ./.github/workflows/build.yml

  # ──────────────────────────────────────────────────────────────
  # Snap Store: the beta or stable channel
  # ──────────────────────────────────────────────────────────────
  publish-snap:
    needs: [channel, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: snap
      - id: snap
        run: echo "path=$(ls subtitld_*.snap | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: ${{ needs.channel.outputs.channel }}

  # ──────────────────────────────────────────────────────────────
  # Microsoft Store: stable only (no package flight for betas)
  # ──────────────────────────────────────────────────────────────
  publish-msstore:
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-msix
      - uses: microsoft/setup-msstore-cli@v1
      - name: Configure msstore CLI
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" `
            --sellerId "${{ env.MSSTORE_SELLER_ID }}" `
            --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" `
            --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"
      - name: Publish to Microsoft Store
        run: |
          $msix = Get-ChildItem -Filter 'Subtitld-*.msix' | Select-Object -First 1
          msstore publish --appId $env:MSSTORE_APP_ID $msix.FullName

  # ──────────────────────────────────────────────────────────────
  # PyPI: stable only; the wheel and sdist build.yml tested
  # ──────────────────────────────────────────────────────────────
  publish-pypi:
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pip
          path: dist
      - run: |
          pip install twine
          twine upload dist/* -u __token__ -p "${{ secrets.PYPI_TOKEN }}"

  # ──────────────────────────────────────────────────────────────
  # AUR: stable only, building from the tag
  # ──────────────────────────────────────────────────────────────
  publish-aur:
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Point the PKGBUILD at the tag
        run: |
          curl -fsSL -o tag.tar.gz "https://github.com/Subtitld/subtitld/archive/refs/tags/$TAG.tar.gz"
          sum=$(sha256sum tag.tar.gz | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^_tag=.*/_tag=$TAG/" \
            -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/subtitld/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: subtitld
          pkgbuild: packaging/aur/subtitld/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.VERSION }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

  # ──────────────────────────────────────────────────────────────
  # GitHub Release: stable only, with every package and the Haiku
  # ports as they go to haikuports
  # ──────────────────────────────────────────────────────────────
  publish-github-release:
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '{pip,appimage,snap,flatpak,windows-*,macos-dmg,haiku}'
          merge-multiple: true
      - name: Point the Haiku recipe at the tag
        run: |
          # The recipe fetches tag v$portVersion: named after the tag, it is
          # the recipe for that release, as haikuports takes it.
          curl -fsSL -o tag.tar.gz "https://github.com/Subtitld/subtitld/archive/refs/tags/$TAG.tar.gz"
          sum=$(sha256sum tag.tar.gz | cut -d' ' -f1)
          dir=artifacts/haikuports/media-video/subtitld
          mv "$dir/subtitld-$VERSION.recipe" "$dir/subtitld-${TAG#v}.recipe"
          sed -i "s|^CHECKSUM_SHA256=.*|CHECKSUM_SHA256=\"$sum\"|" "$dir/subtitld-${TAG#v}.recipe"
          # One file for the release: the ports, to unpack into haikuports.
          tar -C artifacts/haikuports -czf "artifacts/subtitld-$VERSION-haikuports.tar.gz" dev-python media-video
          rm -r artifacts/haikuports
      # The release published: its title and notes stay, the build
      # version (the date; the tag is a free-form label) follows them,
      # and every package is attached.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            Build version: `${{ env.VERSION }}`
          append_body: true
          files: artifacts/*
