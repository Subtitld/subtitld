app-id: org.subtitld.Subtitld
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: subtitld

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --env=QT_QPA_PLATFORMTHEME=gtk3

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # FFmpeg is the runtime's (with the full codec set from its codecs-extra
  # extension), and PySide6 and NumPy come with the BaseApp. PortAudio, for
  # playback and recording through sounddevice, is not in either.
  - name: portaudio
    config-opts:
      - --disable-static
      - --without-jack
      - --without-oss
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
    sources:
      - type: archive
        url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def

  # libdatachannel, for live co-editing's direct links between collaborators
  # (media goes from one Subtitld to another, never through a server). Data
  # channels only, with the runtime's OpenSSL.
  - name: libdatachannel
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DNO_MEDIA=ON
      - -DNO_WEBSOCKET=ON
      - -DNO_EXAMPLES=ON
      - -DNO_TESTS=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    post-install:
      - install -Dm644 LICENSE /app/share/licenses/libdatachannel/LICENSE
      - install -Dm644 deps/libjuice/LICENSE /app/share/licenses/libdatachannel/LICENSE.libjuice
      - install -Dm644 deps/usrsctp/LICENSE.md /app/share/licenses/libdatachannel/LICENSE.usrsctp
    sources:
      - type: git
        url: https://github.com/paullouisageneau/libdatachannel.git
        tag: v0.23.2
        commit: 9e6a13abbb6846c003d817d0387b6706466e2b03

  # Generated by flatpak-pip-generator; see flatpak/README.md.
  - python-modules.json

  - name: subtitld
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 flatpak/org.subtitld.Subtitld.desktop
          /app/share/applications/org.subtitld.Subtitld.desktop
      - install -Dm644 flatpak/org.subtitld.Subtitld.appdata.xml
          /app/share/metainfo/org.subtitld.Subtitld.appdata.xml
      - install -Dm644 flatpak/org.subtitld.Subtitld.mime.xml
          /app/share/mime/packages/org.subtitld.Subtitld.xml
      - mkdir -p /app/share/icons && cp -r flatpak/icons/hicolor /app/share/icons/
      - install -Dm644 src/subtitld/graphics/subtitld.png
          /app/share/icons/hicolor/512x512/apps/org.subtitld.Subtitld.png
      - install -Dm644 src/subtitld/graphics/subtitld.svg
          /app/share/icons/hicolor/scalable/apps/org.subtitld.Subtitld.svg
    sources:
      - type: dir
        path: ..
