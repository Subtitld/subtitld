app-id: org.subtitld.Subtitld
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: subtitld

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  - --env=QT_QPA_PLATFORMTHEME=gtk3

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # FFmpeg is the runtime's (with the full codec set from its codecs-extra
  # extension), and PySide6 and NumPy come with the BaseApp. PortAudio, for
  # playback and recording through sounddevice, is not in either.
  - name: portaudio
    config-opts:
      - --disable-static
      - --without-jack
      - --without-oss
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
    sources:
      - type: archive
        url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def

  # Generated by flatpak-pip-generator; see flatpak/README.md.
  - python-modules.json

  - name: subtitld
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 flatpak/org.subtitld.Subtitld.desktop
          /app/share/applications/org.subtitld.Subtitld.desktop
      - install -Dm644 flatpak/org.subtitld.Subtitld.appdata.xml
          /app/share/metainfo/org.subtitld.Subtitld.appdata.xml
      - install -Dm644 src/subtitld/graphics/subtitld.png
          /app/share/icons/hicolor/512x512/apps/org.subtitld.Subtitld.png
      - install -Dm644 src/subtitld/graphics/subtitld.svg
          /app/share/icons/hicolor/scalable/apps/org.subtitld.Subtitld.svg
    sources:
      - type: dir
        path: ..
