version: 1
script:
  # Limpar build anterior
  - rm -rf AppDir | true
  
  # Instalar dependências do sistema no AppDir
  - apt-get update
  - apt-get install -y --no-install-recommends -q
      python3
      python3-pip
      python3-dev
  
  # Instalar o projeto via pip
  - python3 -m pip install --upgrade pip
  - python3 -m pip install --no-cache-dir .
  
  # Copiar arquivos para AppDir
  - python3 setup.py install --root=AppDir

  # Copiar ícone para o AppDir
  - mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
  - cp subtitld/graphics/subtitld.png AppDir/usr/share/icons/hicolor/512x512/apps/subtitld.png
  - cp subtitld/graphics/subtitld.png AppDir/subtitld.png

  # Corrigir paths das bibliotecas nativas
  - sed -i 's/find_library(name)/"libffms2.so.5.0.0"/g' AppDir/usr/local/lib/python3.*/dist-packages/ffms2/get_library.py || true
  - sed -i 's/raise OSError("Cannot find libmpv in the usual places. Depending on your distro, you may try installing an "/sofile = "libmpv.so.1"/g' AppDir/usr/local/lib/python3.*/dist-packages/mpv.py || true
  - sed -i 's/                "mpv-devel or mpv-libs package. If you have libmpv around but this script can/        #/g' AppDir/usr/local/lib/python3.*/dist-packages/mpv.py || true
  - sed -i 's/                "the documentation for ctypes/        #/g' AppDir/usr/local/lib/python3.*/dist-packages/mpv.py || true
  - sed -i 's/                "filename.")/        #/g' AppDir/usr/local/lib/python3.*/dist-packages/mpv.py || true

AppDir:
  path: ./AppDir

  app_info:
    id: org.subtitld.Subtitld
    name: Subtitld
    icon: subtitld
    version: ${VERSION_NUMBER}
    exec: usr/bin/python3
    exec_args: "$APPDIR/usr/bin/subtitld $@"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'

    include:
      - python3
      - python3-pkg-resources
      - libffms2-5
      - libmpv1
      - libglib2.0-0
      - libgl1
      - libxcb-xinerama0

  runtime:
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONPATH: '${APPDIR}/usr/local/lib/python3.10/dist-packages:${APPDIR}/usr/lib/python3.10'


AppImage:
  update-information: 'gh-releases-zsync|AppImageCrafters|subtitld|latest|Subtitld-*x86_64.AppImage.zsync'
  sign-key: None
  arch: x86_64
