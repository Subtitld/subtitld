version: 1
script:
  - rm -rf AppDir | true
  - mv dist/subtitld AppDir
  - ls -la
  #   - python3.10 -m pip install --upgrade --force-reinstall --prefix=/usr --root=AppDir .
  #   - python3.10 -m pip install . --prefix=/usr --root=AppDir
  - mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
  - cp snap/gui/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/org.jonata.Subtitld.png
  


AppDir:
  path: ./AppDir

  app_info:
    id: org.jonata.Subtitld
    name: Subtitld
    icon: org.jonata.Subtitld
    version: 22.09.01.01
    exec: "subtitld"
    exec_args: "$@"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'

    include:
      - python3
      - python3-pkg-resources

  runtime:
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONPATH: '${APPDIR}/usr/lib/python3.10/site-packages'


AppImage:
  update-information: 'gh-releases-zsync|AppImageCrafters|subtitld|latest|Subtitld-*x86_64.AppImage.zsync'
  sign-key: None
  arch: x86_64
